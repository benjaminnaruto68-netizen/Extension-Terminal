<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extension Terminal Companion</title>
<style>
*{box-sizing:border-box}body{margin:0;width:370px;max-height:600px;overflow:auto;background:#0b1020;color:#d8e5ff;font:13px system-ui;padding:16px}
h1{font-size:18px;color:#7cf7c4;margin:0 0 4px}p{color:#9aabc9;font-size:12px;margin:0 0 12px}
input{width:100%;padding:10px;border-radius:8px;background:#151d31;border:1px solid #33425f;color:#fff;margin-bottom:10px}
button{border:0;border-radius:7px;padding:8px 10px;font-weight:700;cursor:pointer;background:#62e6ad;color:#08130f}
#scan{width:100%;margin-bottom:10px}#status{padding:9px;background:#151d31;border-radius:8px;margin-bottom:10px;color:#c5d4ee}
.card{background:#111a2b;border:1px solid #293b57;border-radius:10px;padding:10px;margin-bottom:8px}
.name{font-weight:700;word-break:break-word}.id{font-size:10px;color:#8296b7;word-break:break-all;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.state{font-size:11px;color:#8fb3d8}.toggle.off{background:#ff747d;color:#200a0c}
.protected{font-size:11px;color:#ffc978}.empty{color:#8fa5c3;padding:12px;text-align:center}
small{display:block;color:#7589a8;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<h1>Extension Terminal</h1>
<p>Extension list for this Chrome profile</p>
<button id="scan">Scan extensions</button>
<input id="search" placeholder="Search by name or ID..." autocomplete="off">
<div id="status">Ready. Scan to list extensions.</div>
<div id="list"></div>
<small>Only ordinary user-installed extensions that Chrome marks changeable have individual controls. Managed or protected extensions are shown without controls.</small>
<script src="popup.js"></script>
</body>
</html>
